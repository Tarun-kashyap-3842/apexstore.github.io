<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apex Store - Gaming Shop</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1f1f1f;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 36px;
      color: #00ff99;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .product {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,255,153,0.1);
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }
    .product h3 {
      margin: 10px 0 5px;
    }
    .product p {
      color: #00ff99;
      font-weight: bold;
    }
    footer {
      background: #1f1f1f;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    <h1>Apex Store</h1>
    <p>Your Ultimate Gaming Gear Shop 🎮</p>
  </header>

  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/220x150?text=Gaming+Mouse" alt="Gaming Mouse">
      <h3>Gaming Mouse</h3>
      <p>₹999</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/220x150?text=RGB+Keyboard" alt="RGB Keyboard">
      <h3>RGB Keyboard</h3>
      <p>₹1499</p>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/220x150?text=Gaming+Headset" alt="Gaming Headset">
      <h3>Gaming Headset</h3>
      <p>₹1299</p>
    </div>
  </section>

  <footer>
    &copy; 2025 Apex Store. All rights reserved.
  </footer>
</body>
</html>
